name: Build Payment Gateway

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pay-gateway-build.yml'
      - 'deploy/patches/bepusdt-reservation.patch'

permissions:
  contents: read

concurrency:
  group: pay-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gateway
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -trimpath
      CGO_ENABLED: '0'
    steps:
      - name: 获取集成补丁
        uses: actions/checkout@v4
        with:
          path: integration
          persist-credentials: false
      - name: 获取固定版本的网关上游源码
        uses: actions/checkout@v4
        with:
          repository: xf959211192/BEpusdt
          ref: 4cee789765dc47da450003c973efb710bfa2a5e2
          path: gateway
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: gateway/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 核对 fork 已包含安全补丁
        run: |
          git apply --reverse --check ../integration/deploy/patches/bepusdt-reservation.patch
      - name: 构建并嵌入管理页面
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build:prod
          cp -R web/dist/. static/secure/
          test -s static/secure/secure.html
      - name: 构建 Linux 网关
        run: |
          mkdir -p ../dist-pay
          go build -ldflags '-s -w -X github.com/v03413/bepusdt/app.Version=1.24.2-main.d36d34f-reservation.3' -o ../dist-pay/bepusdt ./main
      - name: 回归测试与静态检查
        run: |
          timeout 60s go test -count=1 -timeout=45s ./app/model ./app/task ./app/task/notify ./app/router
          timeout 60s go vet ./app/model ./app/task ./app/router
      - name: 保存来源及校验记录
        run: |
          cp ../integration/deploy/patches/bepusdt-reservation.patch ../dist-pay/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('../dist-pay')
          metadata={'upstream':'v03413/BEpusdt','upstream_commit':'d36d34fe04725b5be121d2877f6251da9cc6089b','fork':'xf959211192/BEpusdt','fork_commit':'4cee789765dc47da450003c973efb710bfa2a5e2','integration_commit':os.environ['GITHUB_SHA'],'version':'1.24.2-main.d36d34f-reservation.3','tests':'passed'}
          metadata['sha256']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          (root/'build-metadata.json').write_text(json.dumps(metadata,indent=2))
          PY
          cd ../dist-pay
          sha256sum bepusdt bepusdt-reservation.patch build-metadata.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bepusdt-linux-amd64
          path: dist-pay/
          if-no-files-found: error
          retention-days: 30
